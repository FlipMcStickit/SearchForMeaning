<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kevin's Existential Crisis: Spherical Stability</title>
    <style>
        body { margin: 0; background-color: #05050a; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; color: white; font-family: 'Georgia', serif; }
        canvas { border: 2px solid #222; background-color: #000; box-shadow: 0 0 50px rgba(0, 0, 0, 1); }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="600" height="400"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const SPHERE_RADIUS = 200;
        const MOVE_STEP = 0.15; 
        let sparkSize = 12;

        let snake = [{ lat: 0, lon: 0 }]; 
        let inputQueue = [];
        let food = { lat: 0.5, lon: 0.5 };
        let obstacles = [];
        let isGameOver = false;
        let lastUpdateTime = 0;
        let moveInterval = 120;

        function resetGame() {
            snake = [{ lat: 0, lon: 0 }];
            inputQueue = [];
            isGameOver = false;
            generateObstacles();
            spawnFood();
        }

        function spawnFood() {
            food = {
                lat: (Math.random() - 0.5) * Math.PI,
                lon: (Math.random() - 0.5) * Math.PI * 2
            };
        }

        function generateObstacles() {
            obstacles = [];
            for(let i=0; i<20; i++) {
                obstacles.push({
                    lat: (Math.random() - 0.5) * Math.PI,
                    lon: (Math.random() - 0.5) * Math.PI * 2
                });
            }
        }

        window.addEventListener('keydown', (e) => {
            if (isGameOver && (e.key === ' ' || e.key === 'Enter')) { resetGame(); return; }
            if (e.key === 'ArrowUp' || e.key === 'w')    inputQueue.push({ dLat: MOVE_STEP, dLon: 0 });
            if (e.key === 'ArrowDown' || e.key === 's')  inputQueue.push({ dLat: -MOVE_STEP, dLon: 0 });
            if (e.key === 'ArrowLeft' || e.key === 'a')  inputQueue.push({ dLat: 0, dLon: -MOVE_STEP });
            if (e.key === 'ArrowRight' || e.key === 'd') inputQueue.push({ dLat: 0, dLon: MOVE_STEP });
        });

        function getCartesian(lat, lon) {
            return {
                x: SPHERE_RADIUS * Math.cos(lat) * Math.cos(lon),
                y: SPHERE_RADIUS * Math.sin(lat),
                z: SPHERE_RADIUS * Math.cos(lat) * Math.sin(lon)
            };
        }

        function getDist(p1, p2) {
            const c1 = getCartesian(p1.lat, p1.lon);
            const c2 = getCartesian(p2.lat, p2.lon);
            return Math.hypot(c1.x - c2.x, c1.y - c2.y, c1.z - c2.z);
        }

        function update() {
            let currentTime = Date.now();
            if (currentTime - lastUpdateTime < moveInterval) return;
            lastUpdateTime = currentTime;

            if (inputQueue.length > 0) {
                const move = inputQueue.shift();
                const head = snake[0];

                let newLat = head.lat + move.dLat;
                let newLon = head.lon + move.dLon;

                // Clamp Latitude
                if (newLat > Math.PI/2) newLat = Math.PI/2;
                if (newLat < -Math.PI/2) newLat = -Math.PI/2;

                const newHead = { lat: newLat, lon: newLon };

                const hitObstacle = obstacles.some(o => getDist(newHead, o) < 25);
                const hitSelf = snake.slice(1).some(s => getDist(newHead, s) < 15);

                if (hitObstacle || hitSelf) {
                    isGameOver = true;
                } else {
                    snake.unshift(newHead);
                    if (getDist(newHead, food) < 25) {
                        spawnFood();
                    } else {
                        snake.pop();
                    }
                }
            }
        }

        function draw() {
            update();
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const head = snake[0];
            const headPos = getCartesian(head.lat, head.lon);

            /**
             * THE TRUE 3D PROJECTION ENGINE
             * To keep the head at the center, we rotate the entire world 
             * around the origin so the head position maps to (0, 0, SPHERE_RADIUS)
             */
            const project = (lat, lon) => {
                const p = getCartesian(lat, lon);

                // 1. Rotate world so Head is at the "Front" (0,0,R)
                // We use a simplified rotation approach: 
                // Rotate around Y to align Lon, then rotate around X to align Lat.

                // Step A: Rotate around Y by -head.lon
                let x1 = p.x * Math.cos(-head.lon) - p.z * Math.sin(-head.lon);
                let y1 = p.y;
                let z1 = p.x * Math.sin(-head.lon) + p.z * Math.cos(-head.lon);

                // Step B: Rotate around X by -head.lat (using adjusted lat)
                // We must account for the fact that the target Y is head.y
                // This effectively makes the head the "North Pole" of our view.
                let x2 = x1;
                let y2 = y1 * Math.cos(-head.lat) - z1 * Math.sin(-head.lat);
                let z2 = y1 * Math.sin(-head.lat) + z1 * Math.cos(-head.lat);

                // 2. Perspective Projection
                const cameraDist = 550; 
                // The camera is looking at the origin. The sphere is at 0,0,0.
                // To see the head, we offset the world so head is at (0,0, cameraDist - R)
                // But a simpler way: Use Z as depth.
                const scale = cameraDist / (cameraDist - z2);

                // Determine if point is on the front half of the sphere
                const isVisible = z2 > -50; 

                return {
                    x: x2 * scale + canvas.width / 2,
                    y: y2 * scale + canvas.height / 2,
                    scale: scale,
                    visible: isVisible
                };
            };

            if (isGameOver) {
                ctx.fillStyle = "white";
                ctx.textAlign = "center";
                ctx.font = "30px Georgia";
                ctx.fillText("THE VOID CONSUMES ALL", canvas.width / 2, canvas.height / 2);
                ctx.font = "16px Georgia";
                ctx.fillText("Press Space to seek meaning again", canvas.width / 2, canvas.height / 2 + 40);
            } else {
                // --- DRAW SPHERE GRID ---
                ctx.strokeStyle = "#1a1a3a";
                ctx.lineWidth = 1;

                // Latitudinal lines
                for (let i = -5; i <= 5; i++) {
                    const lat = (i / 5) * (Math.PI / 2);
                    ctx.beginPath();
                    let first = true;
                    for (let step = 0; step <= Math.PI * 2; step += 0.2) {
                        const p = project(lat, step);
                        if (p.visible) {
                            if (first) ctx.moveTo(p.x, p.y);
                            else ctx.lineTo(p.x, p.y);
                            first = false;
                        }
                    }
                    ctx.stroke();
                }

                // Longitudinal lines
                for (let i = 0; i < 12; i++) {
                    const lon = (i / 12) * Math.PI * 2;
                    ctx.beginPath();
                    let first = true;
                    for (let step = -Math.PI/2; step <= Math.PI/2; step += 0.1) {
                        const p = project(step, lon);
                        if (p.visible) {
                            if (first) ctx.moveTo(p.x, p.y);
                            else ctx.lineTo(p.x, p.y);
                            first = false;
                        }
                    }
                    ctx.stroke();
                }

                // --- DRAW GAME OBJECTS ---

                // Obstacles
                ctx.fillStyle = "#444";
                obstacles.forEach(o => {
                    const p = project(o.lat, o.lon);
                    if (p.visible) {
                        ctx.globalAlpha = Math.max(0, p.scale * 0.6);
                        ctx.fillRect(p.x - sparkSize/2, p.y - sparkSize/2, sparkSize, sparkSize);
                    }
                });

                // Food
                const fp = project(food.lat, food.lon);
                if (fp.visible) {
                    ctx.fillStyle = "red";
                    ctx.globalAlpha = Math.max(0, fp.scale);
                    ctx.beginPath();
                    ctx.arc(fp.x, fp.y, sparkSize * fp.scale, 0, Math.PI*2);
                    ctx.fill();
                }

                // Snake
                snake.forEach((s, i) => {
                    const p = project(s.lat, s.lon);
                    if (p.visible) {
                        ctx.fillStyle = i === 0 ? "#00ffaa" : "#008866";
                        ctx.globalAlpha = Math.max(0, p.scale);
                        // Center the square on the point
                        ctx.fillRect(p.x - sparkSize/2, p.y - sparkSize/2, sparkSize, sparkSize);
                    }
                });
                ctx.globalAlpha = 1.0;
            }

            requestAnimationFrame(draw);
        }

        resetGame();
        draw();
    </script>
</body>
</html>
