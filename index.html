<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Snake: Spherical Odyssey - V25 FULL STABLE</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
        #ui { position: absolute; top: 20px; width: 100%; text-align: center; color: #00ffaa; pointer-events: none; text-shadow: 0 0 10px #00ffaa; }
        #game-over { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; text-align: center; display: none; background: rgba(0,0,0,0.9); padding: 40px; border: 2px solid #ff4444; border-radius: 15px; z-index: 10; }
        button { background: #00ffaa; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; margin-top: 20px; }
		#pause-ui { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 3em; display: none; pointer-events: none; }
    </style>
</head>
<body>
    <div id="ui"><h1 id="score">SCORE: 0</h1></div>
    <div id="pause-ui">PAUSED</div>
	<div id="game-over">
        <h1 style="color: #ff4444;">VOID CONSUMED YOU</h1>
        <p id="final-score"></p>
        <button onclick="location.reload()">RESTART</button>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- CONFIGURATION ---
        const RADIUS = 10;
        const STEP_DISTANCE = 0.45;
        const MOVE_INTERVAL = 150; 

        // --- STATE ---
        let score = 0;
        let isGameOver = false;
		let isPaused = false;
        let snakePositions = []; 
        let snakeMeshes = [];
		let visualPositions = []; // Stores the smoothed positions for rendering
        let targetPositions = []; // Stores the logical positions for collision/logic
        let moveDir = new THREE.Vector3(0, 1, 0);
        let inputQueue = []; 
        let lastStepTime = 0;
        let food = { position: new THREE.Vector3(), mesh: null };
        let obstacles = [];
        let visualHeadPos = new THREE.Vector3(RADIUS, 0, 0);
        let smoothedUp = new THREE.Vector3(0, 1, 0); 
        const cameraUpTarget = new THREE.Vector3();

        // --- THREE.JS SETUP ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Starfield
        const starGeo = new THREE.BufferGeometry();
        const starCoords = [];
        for(let i=0; i<2000; i++) starCoords.push((Math.random()-0.5)*400, (Math.random()-0.5)*400, (Math.random()-0.5)*400);
        starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starCoords, 3));
        scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.7 })));

        scene.add(new THREE.AmbientLight(0x404040, 2));
        const light = new THREE.PointLight(0x00ffaa, 100, 50);
        scene.add(light);

        const planet = new THREE.Mesh(new THREE.SphereGeometry(RADIUS, 48, 48), new THREE.MeshPhongMaterial({ color: 0x111122, wireframe: true }));
        scene.add(planet);

        // --- INITIALIZE FOOD MESH ---
        const foodGeo = new THREE.SphereGeometry(0.5, 16, 16);
        const foodMat = new THREE.MeshPhongMaterial({ color: 0xff00ff, emissive: 0xff00ff, emissiveIntensity: 0.5 });
        const foodMesh = new THREE.Mesh(foodGeo, foodMat);
        scene.add(foodMesh);
        food = { position: new THREE.Vector3(), mesh: foodMesh };

        function createHead() {
            const group = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), new THREE.MeshPhongMaterial({ color: 0x00ffaa }));
            group.add(body);
            const nose = new THREE.Mesh(new THREE.ConeGeometry(0.25, 0.6, 8), new THREE.MeshPhongMaterial({ color: 0xffffff }));
            nose.rotation.x = Math.PI / 2; 
            nose.position.z = -0.5; 
            group.add(nose);
            return group;
        }

        function createSegment() {
            return new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), new THREE.MeshPhongMaterial({ color: 0x00cc88 }));
        }

        function spawnFood() {
            let validSpawn = false;
            let attempts = 0;
            const MAX_ATTEMPTS = 100;
            let newFoodPos = new THREE.Vector3();

            while (!validSpawn && attempts < MAX_ATTEMPTS) {
                attempts++;
                // Uniform distribution on sphere
                const phi = Math.acos(2 * Math.random() - 1); 
                const theta = Math.random() * Math.PI * 2;

                newFoodPos.set(
                    RADIUS * Math.sin(phi) * Math.cos(theta),
                    RADIUS * Math.sin(phi) * Math.sin(theta),
                    RADIUS * Math.cos(phi)
                );

                let collisionWithObstacle = false;
                for (let i = 0; i < obstacles.length; i++) {
                    if (newFoodPos.distanceTo(obstacles[i].position) < 1.5) {
                        collisionWithObstacle = true;
                        break;
                    }
                }

                let collisionWithSnake = false;
                for (let i = 0; i < snakePositions.length; i++) {
                    if (newFoodPos.distanceTo(snakePositions[i]) < 1.5) {
                        collisionWithSnake = true;
                        break;
                    }
                }

                if (!collisionWithObstacle && !collisionWithSnake) {
                    validSpawn = true;
                }
            }

            food.position.copy(newFoodPos);
            food.mesh.position.copy(newFoodPos);
        }

                function spawnObstacle() {
            const obs = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.7, 0.7), new THREE.MeshPhongMaterial({ color: 0x444444 }));

            let validSpawn = false;
            let attempts = 0;
            const MAX_ATTEMPTS = 50; // Prevent infinite loops if something goes wrong
            const SAFE_DISTANCE = 4.0; // How far from the start the player must be
            const startPos = snakePositions[0]; // The snake's starting position

            while (!validSpawn && attempts < MAX_ATTEMPTS) {
                attempts++;

                // 1. Pick a random spot on the sphere (same logic as food)
                const phi = Math.random() * Math.PI; 
                const theta = Math.random() * Math.PI * 2;
                const potentialPos = new THREE.Vector3(
                    RADIUS * Math.sin(phi) * Math.cos(theta),
                    RADIUS * Math.sin(phi) * Math.sin(theta),
                    RADIUS * Math.cos(phi)
                );

                // 2. Check if this spot is far enough away from the snake's start
                if (potentialPos.distanceTo(startPos) > SAFE_DISTANCE) {
                    validSpawn = true;
                    obs.position.copy(potentialPos);
                }
            }

            // Only add to scene if we found a valid spot
            if (validSpawn) {
                scene.add(obs);
                obstacles.push(obs);
            }
        }

        function initGame() {
            // Reset Meshes
            snakeMeshes.forEach(m => scene.remove(m));
            snakeMeshes = [];
            obstacles.forEach(o => scene.remove(o));
            obstacles = [];

            // Reset State
            snakePositions = [new THREE.Vector3(RADIUS, 0, 0)];
			visualPositions = [new THREE.Vector3(RADIUS, 0, 0)];
            targetPositions = [new THREE.Vector3(RADIUS, 0, 0)];
            const head = createHead();
            snakeMeshes = [head];
            scene.add(head);

            score = 0; 
            isGameOver = false;
            moveDir.set(0, 1, 0);
            inputQueue = []; 
            lastStepTime = performance.now();

            document.getElementById('score').innerText = "SCORE: 0";
            document.getElementById('game-over').style.display = 'none';

            for(let i=0; i<30; i++) spawnObstacle();
            spawnFood();
        }

         window.addEventListener('keydown', (e) => {
            // 1. Handle Pausing first
            if (e.code === 'Space') {
                isPaused = !isPaused; // This flips true to false, or false to true
                return; // Exit the function so pressing space doesn't trigger a move
            }

            if (isGameOver || isPaused) return;

            const currentPos = snakePositions[0].clone().normalize(); 
            const rightVec = new THREE.Vector3().crossVectors(currentPos, moveDir).normalize();
            const upRelativeVec = new THREE.Vector3().crossVectors(rightVec, currentPos).normalize();

            let newDir = moveDir.clone();

            if (e.key === 'a' || e.key === 'ArrowLeft') newDir.copy(rightVec);
            else if (e.key === 'd' || e.key === 'ArrowRight') newDir.copy(rightVec.clone().negate());
            else if (e.key === 'w' || e.key === 'ArrowUp') newDir.copy(upRelativeVec);
            else if (e.key === 's' || e.key === 'ArrowDown') newDir.copy(upRelativeVec.clone().negate());

            if (newDir.dot(moveDir) < -0.5) return;

            newDir.projectOnPlane(currentPos);
            newDir.normalize();

            inputQueue.push(newDir.clone());
            if(inputQueue.length > 3) inputQueue.shift();
        });

        function closestPointOnSegment(A, B, P) {
            const AB = new THREE.Vector3().subVectors(B, A);
            const AP = new THREE.Vector3().subVectors(P, A);
            let t = AP.dot(AB) / AB.dot(AB);
            t = Math.max(0, Math.min(1, t)); 
            return new THREE.Vector3().addVectors(A, AB.multiplyScalar(t));
        }

        function performMovementStep() {
            if (inputQueue.length > 0) {
                moveDir.copy(inputQueue.shift());
            }

            const currentPos = snakePositions[0].clone();
            const tangentDir = moveDir.clone().normalize();
            const newPos = currentPos.clone()
                .add(tangentDir.multiplyScalar(STEP_DISTANCE))
                .normalize()
                .multiplyScalar(RADIUS);

            moveDir.copy(newPos.clone().sub(currentPos).normalize());

            // 1. SWEEP COLLISION (Self)
            let collisionDetected = false;
            const collisionRadius = 0.4;

            for (let i = 1; i < snakePositions.length; i++) {
                const bodySegmentPos = snakePositions[i];
                if (i === 1) continue; 

                const closestPointOnPath = closestPointOnSegment(currentPos, newPos, bodySegmentPos);
                if (closestPointOnPath.distanceTo(bodySegmentPos) < collisionRadius) {
                    collisionDetected = true;
                    break;
                }
            }

            // 2. OBSTACLE COLLISION
            if (!collisionDetected) {
                for (let i = 0; i < obstacles.length; i++) {
                    if (newPos.distanceTo(obstacles[i].position) < 0.8) {
                        collisionDetected = true;
                        break;
                    }
                }
            }

            if (collisionDetected) {
                endGame();
                return;
            }

                        // 3. EATING & POSITION UPDATE
            const eating = newPos.distanceTo(food.position) < 1.0;
            if (eating) {
                score += 10;
                document.getElementById('score').innerText = `SCORE: ${score}`;
                spawnFood();
            } else {
                targetPositions.pop();
                visualPositions.pop(); // Keep visual array in sync with logic
            }
            targetPositions.unshift(newPos.clone());
            visualPositions.unshift(newPos.clone()); // Start visual at the new position

            // 4. MESH SYNC (Managing the number of meshes)
            while (snakeMeshes.length < targetPositions.length) {
                const m = snakeMeshes.length === 0 ? createHead() : createSegment();
                snakeMeshes.push(m);
                scene.add(m);
            }
            while (snakeMeshes.length > targetPositions.length) {
                scene.remove(snakeMeshes.pop());
                visualPositions.pop();
                targetPositions.pop();
            }

            // Note: We do NOT update mesh.position here anymore. 
            // We do it in the animate() loop for smoothness.
            for (let i = 0; i < snakeMeshes.length; i++) {
                const upVector = targetPositions[i].clone().normalize();
                if (i < targetPositions.length - 1) {
                    snakeMeshes[i].lookAt(targetPositions[i+1]);
                } else {
                    const lookTarget = targetPositions[i].clone().add(moveDir);
                    snakeMeshes[i].lookAt(lookTarget);
                }
                snakeMeshes[i].up.copy(upVector);
            }
        }

        function endGame() {
            isGameOver = true;
            document.getElementById('game-over').style.display = 'block';
            document.getElementById('final-score').innerText = `FINAL SCORE: ${score}`;
        }

                        function animate(currentTime) {
            requestAnimationFrame(animate);

            if (!isGameOver) {
                if (!isPaused) {
                    // This part only runs when the game is ACTIVE
                    document.getElementById('pause-ui').style.display = 'none';

                    if (currentTime - lastStepTime >= MOVE_INTERVAL) {
                        performMovementStep();
                        lastStepTime = currentTime;
                    }

                                        if (snakeMeshes.length > 0) {
                        // 1. Smoothly move the logical positions to the visual positions
                        for (let i = 0; i < snakeMeshes.length; i++) {
                            // LERP: visual moves 20% of the way to target every frame
                            visualPositions[i].lerp(targetPositions[i], 0.2);
                            snakeMeshes[i].position.copy(visualPositions[i]);
                        }

                        // 2. Camera follows the VISUAL head (the first visual position)
                        visualHeadPos.copy(visualPositions[0]); 
                        camera.position.lerp(visualHeadPos.clone().normalize().multiplyScalar(18), 0.05);

                        const headNormal = visualHeadPos.clone().normalize();
                        cameraUpTarget.copy(moveDir).projectOnPlane(headNormal).normalize();
                        smoothedUp.lerp(cameraUpTarget, 0.02); 
                        camera.up.copy(smoothedUp);
                        camera.lookAt(visualHeadPos);

                        light.position.copy(visualHeadPos.clone().multiplyScalar(2));
                    }
                } else {
                    // This part only runs when the game is PAUSED
                    document.getElementById('pause-ui').style.display = 'block';
                }
            }

            // The renderer stays outside all the IF statements so the 
            // graphics keep drawing even when paused or game is over.
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        initGame();
        requestAnimationFrame(animate);
    </script>
</body>
</html>
