<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kevin's Existential Crisis: The Web Void</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0a0a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: white;
            font-family: 'Georgia', serif;
        }
        canvas {
            border: 2px solid #333;
            background-color: #000;
            box-shadow: 0 0 50px rgba(0, 0, 0, 1);
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="600" height="400"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // 1. Variables: The State of Being
        let snake = [{x: 300, y: 200}]; 
        let sparkSize = 10;
        let speed = 10; 

        let lastUpdateTime = 0;
        let moveInterval = 100; 
        let direction = { x: 0, y: 0 }; 
        let food = {x: 100, y: 100}; 

        let inputQueue = [];
        let obstacles = []; 
        let isGameOver = false;

        // CAMERA STATE
        // The camera "drifts" toward the snake head for a smoother, cinematic feel
        let camera = { x: 300, y: 200 };

        // 2. Event Listeners
        window.addEventListener('keydown', (e) => {
            if (isGameOver && (e.key === ' ' || e.key === 'Enter')) {
                resetGame();
                return;
            }

            let newDir = null;
            if (e.key === 'ArrowUp' || e.key === 'w')    newDir = { x: 0, y: -speed };
            if (e.key === 'ArrowDown' || e.key === 's')  newDir = { x: 0, y: speed };
            if (e.key === 'ArrowLeft' || e.key === 'a')  newDir = { x: -speed, y: 0 };
            if (e.key === 'ArrowRight' || e.key === 'd') newDir = { x: speed, y: 0 };

            if (newDir) {
                const lastDir = inputQueue.length > 0 ? inputQueue[inputQueue.length - 1] : direction;
                const isOpposite = (newDir.x !== 0 && lastDir.x !== 0 && (newDir.x === -lastDir.x)) ||
                                   (newDir.y !== 0 && lastDir.y !== 0 && (newDir.y === -lastDir.y));
                if (!isOpposite) inputQueue.push(newDir);
            }
        });

        function isValidPosition(x, y) {
            const hitObstacle = obstacles.some(obs => obs.x === x && obs.y === y);
            const hitSnake = snake.some(seg => seg.x === x && seg.y === y);
            return !hitObstacle && !hitSnake;
        }

        function generateObstacles() {
            obstacles = [];
            const patternCount = 8; // Increased density for a moving camera
            for (let i = 0; i < patternCount; i++) {
                const patternType = Math.floor(Math.random() * 3); 
                let startX = Math.floor(Math.random() * (canvas.width / sparkSize)) * sparkSize;
                let startY = Math.floor(Math.random() * (canvas.height / sparkSize)) * sparkSize;
                const length = Math.floor(Math.random() * 8) + 5; 
                let patternSegments = [];

                if (patternType === 0) {
                    for (let j = 0; j < length; j++) patternSegments.push({ x: startX, y: startY + (j * sparkSize) });
                } else if (patternType === 1) {
                    for (let j = 0; j < length; j++) patternSegments.push({ x: startX + (j * sparkSize), y: startY });
                } else {
                    for (let j = 0; j < Math.floor(length/2); j++) patternSegments.push({ x: startX + (j * sparkSize), y: startY });
                    for (let j = 1; j < Math.ceil(length/2); j++) patternSegments.push({ x: startX + (Math.floor(length/2) * sparkSize), y: startY + (j * sparkSize) });
                }

                patternSegments.forEach(seg => {
                    obstacles.push({ x: seg.x, y: seg.y });
                    // Note: Mirroring is harder with a moving camera, 
                    // so we treat the world as a flat plane that we are "curving" visually.
                });
            }
            obstacles = obstacles.filter(obs => obs.x !== 300 || obs.y !== 200);
        }

        function resetGame() {
            snake = [{x: 300, y: 200}];
            direction = { x: 0, y: 0 };
            inputQueue = [];
            isGameOver = false;
            lastUpdateTime = 0;
            camera = { x: 300, y: 200 };
            generateObstacles(); 
            do {
                food.x = Math.floor(Math.random() * (canvas.width / sparkSize)) * sparkSize;
                food.y = Math.floor(Math.random() * (canvas.height / sparkSize)) * sparkSize;
            } while (!isValidPosition(food.x, food.y));
        }

        // 3. The Game Loop
        function draw() {
            // Update Camera: Interpolate (LERP) towards the snake head
            // This creates the "floating" sensation.
            camera.x += (snake[0].x - camera.x) * 0.1;
            camera.y += (snake[0].y - camera.y) * 0.1;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (isGameOver) {
                ctx.fillStyle = "white";
                ctx.textAlign = "center";
                ctx.font = "30px Georgia";
                ctx.fillText("THE VOID CONSUMES ALL", canvas.width / 2, canvas.height / 2);
                ctx.font = "16px Georgia";
                ctx.fillText("Press Space to seek meaning again", canvas.width / 2, canvas.height / 2 + 40);
            } else {
                /**
                 * MOVING SPHERICAL PROJECTION
                 * Now projects relative to the CAMERA position.
                 */
                const project = (x, y) => {
                    // 1. Distance from CAMERA (the new center of the sphere)
                    const dx = x - camera.x;
                    const dy = y - camera.y;

                    const radius = Math.sqrt(dx * dx + dy * dy);
                    const angle = Math.atan2(dy, dx);

                    // 2. Spherical Distortion
                    // We use a fixed visual radius so the "world" feels consistent 
                    // even as we move.
                    const maxR = 350; 
                    const normalizedR = Math.min(radius / maxR, 1);
                    const distortedR = Math.sin(normalizedR * Math.PI / 2) * maxR;

                    // 3. Convert back to Canvas Space
                    // We center the projection on the middle of the screen
                    return {
                        x: Math.cos(angle) * distortedR + canvas.width / 2,
                        y: Math.sin(angle) * distortedR + canvas.height / 2,
                        scale: Math.cos(normalizedR * Math.PI / 2)
                    };
                };

                // Draw Obstacles
                ctx.fillStyle = "#333"; 
                obstacles.forEach(obs => {
                    const p = project(obs.x, obs.y);
                    // Only draw if within the "viewable" sphere to save performance
                    if (p.scale > 0 && p.scale < 1.5) {
                        ctx.fillRect(p.x, p.y, sparkSize * p.scale, sparkSize * p.scale);
                    }
                });

                // Draw Food
                const fp = project(food.x, food.y);
                if (fp.scale > 0 && fp.scale < 1.5) {
                    ctx.fillStyle = "red";
                    ctx.fillRect(fp.x, fp.y, sparkSize * fp.scale, sparkSize * fp.scale);
                }

                // Movement Logic (Unchanged: remains in Flat Space)
                let currentTime = Date.now();
                if (currentTime - lastUpdateTime >= moveInterval) {
                    if (inputQueue.length > 0) direction = inputQueue.shift();

                    if (direction.x !== 0 || direction.y !== 0) {
                        let newX = snake[0].x + direction.x;
                        let newY = snake[0].y + direction.y;

                        // Wrap-around logic
                        if (newX < 0) newX = canvas.width - sparkSize;
                        else if (newX >= canvas.width) newX = 0;
                        if (newY < 0) newY = canvas.height - sparkSize;
                        else if (newY >= canvas.height) newY = 0;

                        const newHead = { x: newX, y: newY };
                        const hitObstacle = obstacles.some(obs => obs.x === newHead.x && obs.y === newHead.y);
                        const hitSelf = snake.some(segment => segment.x === newHead.x && segment.y === newHead.y);

                        if (hitObstacle || hitSelf) {
                            isGameOver = true;
                        } else {
                            if (newHead.x === food.x && newHead.y === food.y) {
                                snake.unshift(newHead);
                                do {
                                    food.x = Math.floor(Math.random() * (canvas.width / sparkSize)) * sparkSize;
                                    food.y = Math.floor(Math.random() * (canvas.height / sparkSize)) * sparkSize;
                                } while (!isValidPosition(food.x, food.y));
                            } else {
                                snake.unshift(newHead);
                                snake.pop();
                            }
                        }
                    }
                    lastUpdateTime = currentTime;
                }

                // Draw Snake
                snake.forEach(segment => {
                    const p = project(segment.x, segment.y);
                    // The head should always be near the center of the screen
                    if (p.scale > 0 && p.scale < 1.5) {
                        ctx.fillStyle = "#00ffaa";
                        ctx.fillRect(p.x, p.y, sparkSize * p.scale, sparkSize * p.scale);
                    }
                });
            }

            requestAnimationFrame(draw);
        }

        resetGame(); 
        draw();
    </script>
</body>
</html>
