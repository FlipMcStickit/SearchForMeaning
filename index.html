<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake: Spherical Stability</title>
    <style>
        body { margin: 0; background-color: #05050a; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; color: white; font-family: 'Georgia', serif; }
        canvas { border: 2px solid #222; background-color: #000; box-shadow: 0 0 50px rgba(0, 0, 0, 0.5); }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="600" height="400"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const SPHERE_RADIUS = 180;
        const MOVE_STEP = 0.15; // This is now an angular step (radians)
        const VIEW_DISTANCE = 500;
        let sparkSize = 12;

        // Snake is now a list of angles: {theta, phi}
        let snake = [{theta: 0, phi: 0}]; 
        let food = {theta: 0, phi: 0};
        let obstacles = [];
        let inputQueue = [];
        let isGameOver = false;
        let lastUpdateTime = 0;
        let moveInterval = 120;

        function resetGame() {
            snake = [{theta: 0, phi: 0}];
            inputQueue = [];
            isGameOver = false;
            generateObstacles();
            spawnFood();
        }

        // Converts angles to actual 3D X, Y, Z coordinates
        function getCartesian(theta, phi) {
            return {
                x: SPHERE_RADIUS * Math.sin(theta) * Math.cos(phi),
                y: SPHERE_RADIUS * Math.sin(theta) * Math.sin(phi),
                z: SPHERE_RADIUS * Math.cos(theta)
            };
        }

        function spawnFood() {
            food.theta = Math.random() * Math.PI;
            food.phi = Math.random() * Math.PI * 2;
        }

        function generateObstacles() {
            obstacles = [];
            for(let i=0; i<15; i++) {
                obstacles.push({
                    theta: Math.random() * Math.PI,
                    phi: Math.random() * Math.PI * 2
                });
            }
        }

        window.addEventListener('keydown', (e) => {
            if (isGameOver && (e.key === ' ' || e.key === 'Enter')) { resetGame(); return; }
            if (e.key === 'ArrowUp' || e.key === 'w')    inputQueue.push({ dt: -MOVE_STEP, dp: 0 });
            if (e.key === 'ArrowDown' || e.key === 's')  inputQueue.push({ dt: MOVE_STEP, dp: 0 });
            if (e.key === 'ArrowLeft' || e.key === 'a')  inputQueue.push({ dt: 0, dp: -MOVE_STEP });
            if (e.key === 'ArrowRight' || e.key === 'd') inputQueue.push({ dt: 0, dp: MOVE_STEP });
        });

        function update() {
            let currentTime = Date.now();
            if (currentTime - lastUpdateTime < moveInterval) return;
            lastUpdateTime = currentTime;

            if (inputQueue.length > 0) {
                const move = inputQueue.shift();
                const head = snake[0];

                // New head is just the old angles + movement
                const nextTheta = Math.max(0.01, Math.min(Math.PI - 0.01, head.theta + move.dt));
                const nextPhi = head.phi + move.dp;

                const nextPos = getCartesian(nextTheta, nextPhi);

                // Collision check with obstacles
                let hitObstacle = false;
                obstacles.forEach(obs => {
                    const obsPos = getCartesian(obs.theta, obs.phi);
                    const dist = Math.hypot(nextPos.x - obsPos.x, nextPos.y - obsPos.y, nextPos.z - obsPos.z);
                    if (dist < 25) hitObstacle = true;
                });

                // Collision check with self
                let hitSelf = false;
                snake.forEach((seg, idx) => {
                    if (idx === 0) return;
                    const segPos = getCartesian(seg.theta, seg.phi);
                    const dist = Math.hypot(nextPos.x - segPos.x, nextPos.y - segPos.y, nextPos.z - segPos.z);
                    if (dist < 15) hitSelf = true;
                });

                if (hitObstacle || hitSelf) {
                    isGameOver = true;
                } else {
                    snake.unshift({theta: nextTheta, phi: nextPhi});

                    // Food check
                    const foodPos = getCartesian(food.theta, food.phi);
                    const foodDist = Math.hypot(nextPos.x - foodPos.x, nextPos.y - foodPos.y, nextPos.z - foodPos.z);

                    if (foodDist < 30) {
                        spawnFood();
                    } else {
                        snake.pop();
                    }
                }
            }
        }

        function draw() {
            update();
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (isGameOver) {
                ctx.fillStyle = "white";
                ctx.textAlign = "center";
                ctx.font = "30px Georgia";
                ctx.fillText("THE VOID CONSUMES ALL", canvas.width / 2, canvas.height / 2);
                ctx.font = "16px Georgia";
                ctx.fillText("Press Space to restart", canvas.width / 2, canvas.height / 2 + 40);
            } else {
                const head = snake[0];

                // The Projection:
                // To keep the head in center, we rotate every point by the NEGATIVE of the head's angles.
                const project = (theta, phi) => {
                    const p = getCartesian(theta, phi);

                    // 1. Rotate around Y to align Phi
                    const phiDiff = phi - head.phi;
                    const x1 = p.x * Math.cos(phiDiff) + p.z * Math.sin(phiDiff);
                    const z1 = -p.x * Math.sin(phiDiff) + p.z * Math.cos(phiDiff);
                    const y1 = p.y;

                    // 2. Rotate around X to align Theta
                    const thetaDiff = theta - head.theta;
                    // We actually want the view to be looking from the "front", 
                    // so we adjust the rotation to make the head appear at (0,0,R)
                    const y2 = y1 * Math.cos(thetaDiff) - z1 * Math.sin(thetaDiff);
                    const z2 = y1 * Math.sin(thetaDiff) + z1 * Math.cos(thetaDiff);

                    // After these rotations, the head should be roughly at (0, 0, R)
                    // But we need to flip the view so we are looking AT the head.
                    // To make it easy: we'll use a simplified view.

                    // Let's use a more robust rotation: Rotate world so head is at (0,0,R)
                    // This is the "Camera" transformation.
                    const viewP = rotatePointToHead(p, head);

                    const scale = VIEW_DISTANCE / (VIEW_DISTANCE - viewP.z);
                    const isVisible = viewP.z > -100;

                    return {
                        x: viewP.x * scale + canvas.width / 2,
                        y: viewP.y * scale + canvas.height / 2,
                        scale: scale,
                        visible: isVisible
                    };
                };

                // Robust rotation: brings any point to be relative to the head
                function rotatePointToHead(p, head) {
                    // This is the magic part. We treat the head as the orientation.
                    // We rotate the point by the inverse of the head's spherical rotation.
                    // A simpler way to think about it:
                    // 1. Find angle difference
                    const dPhi = p.phi - head.phi; // (Need to pass phi in)
                    // This is getting complex. Let's simplify the projection.
                    // Let's just use the Cartesian coordinates and a standard rotation matrix.
                }

                // RE-SIMPLIFIED PROJECTION:
                // Instead of complex math, we'll just rotate the object by the inverse of the head's position
                const projectSimple = (targetTheta, targetPhi) => {
                    // 1. Get target Cartesian
                    const p = getCartesian(targetTheta, targetPhi);
                    // 2. Get head Cartesian
                    const h = getCartesian(head.theta, head.phi);

                    // 3. Rotation to bring Head to (0,0,R)
                    // We find the rotation that transforms Head -> (0,0,R)
                    // We'll use the angles directly.
                    const rotX = head.theta;
                    const rotY = head.phi;

                    // Rotate point by -rotY (around Y axis)
                    let x = p.x * Math.cos(-rotY) + p.z * Math.sin(-rotY);
                    let z = -p.x * Math.sin(-rotY) + p.z * Math.cos(-rotY);
                    let y = p.y;

                    // Rotate point by -rotX (around X axis)
                    let y2 = y * Math.cos(-rotX) - z * Math.sin(-rotX);
                    let z2 = y * Math.sin(-rotX) + z * Math.cos(-rotX);

                    // Since we rotated the WHOLE world, we must look at the head 
                    // which is now at (0, 0, R) from the center. 
                    // We want to look at it from "outside" the sphere.
                    // So we shift the view.
                    const viewP = { x: x, y: y2, z: z2 };

                    const scale = VIEW_DISTANCE / (VIEW_DISTANCE - viewP.z);
                    const isVisible = viewP.z > -50; 

                    return {
                        x: viewP.x * scale + canvas.width / 2,
                        y: viewP.y * scale + canvas.height / 2,
                        scale: scale,
                        visible: isVisible
                    };
                };

                // --- DRAW GRID ---
                ctx.strokeStyle = "#1a1a3a";
                for (let i = -4; i <= 4; i++) {
                    const lat = (i / 4) * (Math.PI / 2);
                    ctx.beginPath();
                    let first = true;
                    for (let lon = 0; lon <= Math.PI * 2; lon += 0.4) {
                        const proj = projectSimple(lat, lon);
                        if (proj.visible) {
                            if (first) ctx.moveTo(proj.x, proj.y);
                            else ctx.lineTo(proj.x, proj.y);
                            first = false;
                        }
                    }
                    ctx.stroke();
                }

                // --- DRAW OBSTACLES ---
                obstacles.forEach(obs => {
                    const proj = projectSimple(obs.theta, obs.phi);
                    if (proj.visible) {
                        ctx.fillStyle = "#444";
                        ctx.globalAlpha = Math.min(1, proj.scale * 0.6);
                        ctx.fillRect(proj.x - sparkSize/2, proj.y - sparkSize/2, sparkSize, sparkSize);
                    }
                });

                // --- DRAW FOOD ---
                const fp = projectSimple(food.theta, food.phi);
                if (fp.visible) {
                    ctx.fillStyle = "#ff4444";
                    ctx.globalAlpha = Math.min(1, fp.scale);
                    ctx.beginPath();
                    ctx.arc(fp.x, fp.y, sparkSize * fp.scale, 0, Math.PI * 2);
                    ctx.fill();
                }

                // --- DRAW SNAKE ---
                snake.forEach((seg, i) => {
                    const proj = projectSimple(seg.theta, seg.phi);
                    if (proj.visible) {
                        ctx.fillStyle = i === 0 ? "#00ffaa" : "#008866";
                        ctx.globalAlpha = Math.min(1, proj.scale);
                        ctx.fillRect(proj.x - sparkSize/2, proj.y - sparkSize/2, sparkSize, sparkSize);
                    }
                });
                ctx.globalAlpha = 1.0;
            }

            requestAnimationFrame(draw);
        }

        resetGame();
        draw();
    </script>
</body>
</html>
