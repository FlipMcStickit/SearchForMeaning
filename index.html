<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Snake: Spherical Odyssey - Stable Version</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
        #ui { position: absolute; top: 20px; width: 100%; text-align: center; color: #00ffaa; pointer-events: none; text-shadow: 0 0 10px #00ffaa; }
        #game-over { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; text-align: center; display: none; background: rgba(0,0,0,0.9); padding: 40px; border: 2px solid #ff4444; border-radius: 15px; z-index: 10; }
        button { background: #00ffaa; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>
    <div id="ui"><h1 id="score">SCORE: 0</h1></div>
    <div id="game-over">
        <h1 style="color: #ff4444;">VOID CONSUMED YOU</h1>
        <p id="final-score"></p>
        <button onclick="location.reload()">RESTART</button>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const RADIUS = 10;
        const STEP_DISTANCE = 0.4;
        const MOVE_SPEED = 0.15;

        let score = 0;
        let isGameOver = false;
        let snakePositions = []; 
        let snakeMeshes = [];    

        // moveDir is now treated as a direction vector tangent to the sphere
        let moveDir = new THREE.Vector3(0, 1, 0);
        let nextMoveDir = new THREE.Vector3(0, 1, 0);

        let food = { position: new THREE.Vector3(), mesh: null };
        let obstacles = [];
        let visualHeadPos = new THREE.Vector3(RADIUS, 0, 0);

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Starfield
        const starGeo = new THREE.BufferGeometry();
        const starCoords = [];
        for(let i=0; i<2000; i++) starCoords.push((Math.random()-0.5)*400, (Math.random()-0.5)*400, (Math.random()-0.5)*400);
        starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starCoords, 3));
        scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.7 })));

        scene.add(new THREE.AmbientLight(0x404040, 2));
        const light = new THREE.PointLight(0x00ffaa, 100, 50);
        scene.add(light);

        const planet = new THREE.Mesh(new THREE.SphereGeometry(RADIUS, 48, 48), new THREE.MeshPhongMaterial({ color: 0x111122, wireframe: true }));
        scene.add(planet);

        function createHead() {
            const group = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), new THREE.MeshPhongMaterial({ color: 0x00ffaa }));
            group.add(body);
            const nose = new THREE.Mesh(new THREE.ConeGeometry(0.25, 0.6, 8), new THREE.MeshPhongMaterial({ color: 0xffffff }));
            nose.rotation.x = Math.PI / 2; 
            nose.position.z = 0.5; 
            group.add(nose);
            return group;
        }

        function createSegment() {
            return new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), new THREE.MeshPhongMaterial({ color: 0x00cc88 }));
        }

        function spawnFood() {
            if(food.mesh) scene.remove(food.mesh);
            food.mesh = new THREE.Mesh(new THREE.SphereGeometry(0.4, 16, 16), new THREE.MeshPhongMaterial({ color: 0xff4444, emissive: 0xff0000 }));
            const phi = Math.random() * Math.PI * 2;
            const theta = Math.acos((Math.random() * 2) - 1);
            food.position.set(RADIUS * Math.sin(theta) * Math.cos(phi), RADIUS * Math.sin(theta) * Math.sin(phi), RADIUS * Math.cos(theta));
            food.mesh.position.copy(food.position);
            scene.add(food.mesh);
        }

        function spawnObstacle() {
            const obs = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.7, 0.7), new THREE.MeshPhongMaterial({ color: 0x444444 }));
            const phi = Math.random() * Math.PI * 2;
            const theta = Math.acos((Math.random() * 2) - 1);
            obs.position.set(RADIUS * Math.sin(theta) * Math.cos(phi), RADIUS * Math.sin(theta) * Math.sin(phi), RADIUS * Math.cos(theta));
            scene.add(obs);
            obstacles.push(obs);
        }

        function initGame() {
            snakeMeshes.forEach(m => scene.remove(m));
            obstacles.forEach(o => scene.remove(o));
            if(food.mesh) scene.remove(food.mesh);

            snakePositions = [new THREE.Vector3(RADIUS, 0, 0)];
            snakeMeshes = [createHead()];
            scene.add(snakeMeshes[0]);

            obstacles = []; 
            score = 0; 
            isGameOver = false;

            moveDir.set(0, 1, 0);
            nextMoveDir.copy(moveDir);

            document.getElementById('score').innerText = "SCORE: 0";
            document.getElementById('game-over').style.display = 'none';
            for(let i=0; i<30; i++) spawnObstacle();
            spawnFood();
        }

        window.addEventListener('keydown', (e) => {
            if (isGameOver) return;

            const currentPos = snakePositions[0].clone().normalize(); 
            // Calculate local coordinate system based on current movement
            const rightVec = new THREE.Vector3().crossVectors(currentPos, moveDir).normalize();
            const upRelativeVec = new THREE.Vector3().crossVectors(rightVec, currentPos).normalize();

            let requestedDir = moveDir.clone();

            if (e.key === 'a' || e.key === 'ArrowLeft') {
                requestedDir.copy(rightVec); 
            } else if (e.key === 'd' || e.key === 'ArrowRight') {
                requestedDir.copy(rightVec.clone().negate());
            } else if (e.key === 'w' || e.key === 'ArrowUp') {
                requestedDir.copy(upRelativeVec);
            } else if (e.key === 's' || e.key === 'ArrowDown') {
                requestedDir.copy(upRelativeVec.clone().negate());
            }

            // Prevent 180-degree turns
            if (requestedDir.dot(moveDir) < -0.5) return;

            // Project requested direction onto the tangent plane of the sphere
            requestedDir.projectOnPlane(currentPos);
            requestedDir.normalize();
            nextMoveDir.copy(requestedDir);
        });

        let lastMoveTime = 0;
        function update(time) {
            if (isGameOver) return;
            if (time - lastMoveTime < MOVE_SPEED * 1000) return;
            lastMoveTime = time;

            moveDir.copy(nextMoveDir);
            const currentPos = snakePositions[0].clone();
            const currentNormal = currentPos.clone().normalize();

            // 1. FIND ROTATION AXIS
            // The axis of rotation is perpendicular to both the normal and the direction of travel
            const rotationAxis = new THREE.Vector3().crossVectors(currentNormal, moveDir).normalize();

            // 2. MOVE THE POSITION
            // Rotate the current position around the rotation axis by the angular step
            const angle = STEP_DISTANCE / RADIUS;
            const q = new THREE.Quaternion().setFromAxisAngle(rotationAxis, angle);
            const newPos = currentPos.clone().applyQuaternion(q);
            newPos.normalize().multiplyScalar(RADIUS); // Ensure it stays exactly on surface

            // 3. ROTATE THE DIRECTION VECTOR (The Critical Fix)
            // We must rotate the direction vector itself so it stays tangent to the sphere
            // We rotate moveDir around the same rotationAxis by the same angle
            moveDir.applyQuaternion(q);
            moveDir.normalize();

            // Collision Check
            for(let i=1; i<snakePositions.length; i++) {
                if (newPos.distanceTo(snakePositions[i]) < 0.5) { endGame(); return; }
            }
            obstacles.forEach(o => { 
                if (newPos.distanceTo(o.position) < 0.8) endGame(); 
            });

            // Food Check
            const eating = newPos.distanceTo(food.position) < 1.2;
            if (eating) {
                score += 10;
                document.getElementById('score').innerText = `SCORE: ${score}`;
                spawnFood();
            }

            snakePositions.unshift(newPos.clone());
            if (!eating) snakePositions.pop();

            while (snakeMeshes.length < snakePositions.length) {
                const m = snakeMeshes.length === 0 ? createHead() : createSegment();
                snakeMeshes.push(m);
                scene.add(m);
            }
            while (snakeMeshes.length > snakePositions.length) {
                scene.remove(snakeMeshes.pop());
            }

            // --- ORIENTATION LOGIC (The provided fix) ---
            for (let i = 0; i < snakePositions.length; i++) {
                snakeMeshes[i].position.copy(snakePositions[i]);
                const pos = snakePositions[i];
                const normal = pos.clone().normalize(); 

                let forward;
                if (i < snakePositions.length - 1) {
                    forward = snakePositions[i + 1].clone().sub(pos).normalize();
                } else {
                    forward = moveDir.clone().projectOnPlane(normal).normalize();
                    if (forward.length() < 0.01) {
                        const fallback = Math.abs(normal.y) < 0.9 ? new THREE.Vector3(0, 1, 0) : new THREE.Vector3(1, 0, 0);
                        forward = new THREE.Vector3().crossVectors(normal, fallback).normalize();
                    }
                }

                const right = new THREE.Vector3().crossVectors(normal, forward).normalize();
                const actualForward = new THREE.Vector3().crossVectors(right, normal).normalize();

                const targetQuat = new THREE.Quaternion();
                const m = new THREE.Matrix4();
                m.makeBasis(right, normal, actualForward);
                targetQuat.setFromRotationMatrix(m);

                const lerpSpeed = (i === 0) ? 0.4 : 0.2;
                snakeMeshes[i].quaternion.slerp(targetQuat, lerpSpeed);
            }
        }

        function endGame() {
            isGameOver = true;
            document.getElementById('game-over').style.display = 'block';
            document.getElementById('final-score').innerText = `FINAL SCORE: ${score}`;
        }

        function animate(time) {
            requestAnimationFrame(animate);
            update(time);
            if (!isGameOver && snakeMeshes.length > 0) {
                visualHeadPos.lerp(snakeMeshes[0].position, 0.1);
                camera.position.lerp(visualHeadPos.clone().normalize().multiplyScalar(18), 0.05);
                camera.lookAt(visualHeadPos);
                light.position.copy(visualHeadPos.clone().multiplyScalar(2));
            }
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        initGame();
        animate(0);
    </script>
</body>
</html>
