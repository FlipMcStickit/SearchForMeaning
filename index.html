<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Snake: Local-Space Quaternion Integration</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
        #ui { position: absolute; top: 20px; width: 100%; text-align: center; color: #00ffaa; pointer-events: none; text-shadow: 0 0 10px #00ffaa; }
        #game-over { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; text-align: center; display: none; background: rgba(0,0,0,0.9); padding: 40px; border: 2px solid #ff4444; border-radius: 15px; z-index: 10; }
        button { background: #00ffaa; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>
    <div id="ui"><h1 id="score">SCORE: 0</h1></div>
    <div id="game-over">
        <h1 style="color: #ff4444;">VOID CONSUMED YOU</h1>
        <p id="final-score"></p>
        <button onclick="location.reload()">RESTART</button>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- CONSTANTS ---
        const RADIUS = 10;
        const STEP_ANGLE = 0.15; // Rotation around Local X (Forward movement)
        const TURN_ANGLE = 0.12; // Rotation around Local Y (Turning)
        const TICK_RATE = 0.1;   // Seconds between steps
        const START_POINT = new THREE.Vector3(RADIUS, 0, 0);

        // --- GAME STATE ---
        let score = 0;
        let isGameOver = false;
        let lastMoveTime = 0;
        let turnDirection = 0; 

        // The Core Mathematical State
        let headOrientation = new THREE.Quaternion(); // The integral of all local rotations
        let snakeHistory = []; // Array of Quaternions (the path)
        let snakeMeshes = [];

        let food = { position: new THREE.Vector3(), mesh: null };
        let obstacles = [];

        // --- THREE.JS SETUP ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Starfield
        const starGeo = new THREE.BufferGeometry();
        const starCoords = [];
        for(let i=0; i<2000; i++) starCoords.push((Math.random()-0.5)*500, (Math.random()-0.5)*500, (Math.random()-0.5)*500);
        starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starCoords, 3));
        scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.7 })));

        scene.add(new THREE.AmbientLight(0x404040, 2));
        const light = new THREE.PointLight(0x00ffaa, 50, 100);
        scene.add(light);

        // The Sphere Wireframe
        const planet = new THREE.Mesh(
            new THREE.SphereGeometry(RADIUS, 32, 32), 
            new THREE.MeshPhongMaterial({ color: 0x111122, wireframe: true, transparent: true, opacity: 0.2 })
        );
        scene.add(planet);

        // --- FACTORIES ---
        function createHead() {
            const group = new THREE.Group();
            const body = new THREE.Mesh(new THREE.SphereGeometry(0.6, 16, 16), new THREE.MeshPhongMaterial({ color: 0x00ffaa }));
            group.add(body);
            // Nose to indicate direction
            const nose = new THREE.Mesh(new THREE.ConeGeometry(0.3, 0.8, 8), new THREE.MeshPhongMaterial({ color: 0xffffff }));
            nose.rotation.x = Math.PI / 2; 
            nose.position.z = -0.6; 
            group.add(nose);
            return group;
        }

        function createSegment() {
            return new THREE.Mesh(new THREE.SphereGeometry(0.5, 12, 12), new THREE.MeshPhongMaterial({ color: 0x008866 }));
        }

        function spawnFood() {
            if(food.mesh) scene.remove(food.mesh);
            food.mesh = new THREE.Mesh(new THREE.SphereGeometry(0.5, 16, 16), new THREE.MeshPhongMaterial({ color: 0xff4444, emissive: 0xff0000 }));

            // Uniform random point on sphere
            const u = Math.random();
            const v = Math.random();
            const theta = 2 * Math.PI * u;
            const phi = Math.acos(2 * v - 1);

            food.position.set(
                RADIUS * Math.sin(phi) * Math.cos(theta),
                RADIUS * Math.sin(phi) * Math.sin(theta),
                RADIUS * Math.cos(phi)
            );
            food.mesh.position.copy(food.position);
            scene.add(food.mesh);
        }

        function spawnObstacle() {
            const obs = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), new THREE.MeshPhongMaterial({ color: 0x555555 }));
            const u = Math.random();
            const v = Math.random();
            const theta = 2 * Math.PI * u;
            const phi = Math.acos(2 * v - 1);
            obs.position.set(
                RADIUS * Math.sin(phi) * Math.cos(theta),
                RADIUS * Math.sin(phi) * Math.sin(theta),
                RADIUS * Math.cos(phi)
            );
            scene.add(obs);
            obstacles.push(obs);
        }

        // --- GAME LOGIC ---
        function initGame() {
            // Reset State
            headOrientation.set(0, 0, 0, 1); 
            snakeHistory = [headOrientation.clone()];
            snakeMeshes.forEach(m => scene.remove(m));
            obstacles.forEach(o => scene.remove(o));
            if(food.mesh) scene.remove(food.mesh);

            snakeMeshes = [createHead()];
            scene.add(snakeMeshes[0]);

            score = 0; 
            isGameOver = false;
            turnDirection = 0;
            obstacles = [];

            document.getElementById('score').innerText = "SCORE: 0";
            document.getElementById('game-over').style.display = 'none';

            for(let i=0; i<25; i++) spawnObstacle();
            spawnFood();
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'a' || e.key === 'ArrowLeft') turnDirection = -1;
            if (e.key === 'd' || e.key === 'ArrowRight') turnDirection = 1;
        });
        window.addEventListener('keyup', (e) => {
            if (['a', 'd', 'ArrowLeft', 'ArrowRight'].includes(e.key)) turnDirection = 0;
        });

        function update(time) {
            if (isGameOver) return;

            // 1. TURN (Apply to Head Orientation via Local Y Axis)
            if (turnDirection !== 0) {
                const turnQuat = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), turnDirection * TURN_ANGLE);
                headOrientation.multiply(turnQuat);
            }

            // 2. MOVE (Tick-based integration)
            if (time - lastMoveTime > TICK_RATE * 1000) {
                lastMoveTime = time;

                // Forward movement: Apply rotation around Local X Axis
                const moveQuat = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), STEP_ANGLE);
                headOrientation.multiply(moveQuat);

                // Store current orientation in history
                snakeHistory.unshift(headOrientation.clone());

                // Derive current 3D position from Quaternion
                const headPos = START_POINT.clone().applyQuaternion(headOrientation);

                // COLLISION: Obstacles
                obstacles.forEach(o => { 
                    if (headPos.distanceTo(o.position) < 1.5) endGame(); 
                });

                // COLLISION: Body (Self-collision)
                for(let i=1; i < Math.min(snakeHistory.length, 15); i++) {
                    const bodyPos = START_POINT.clone().applyQuaternion(snakeHistory[i]);
                    if (headPos.distanceTo(bodyPos) < 0.8) endGame();
                }

                // COLLISION: Food
                if (headPos.distanceTo(food.position) < 1.6) {
                    score += 10;
                    document.getElementById('score').innerText = `SCORE: ${score}`;
                    spawnFood();
                    // Growth: We don't pop from history
                } else {
                    if (snakeHistory.length > 1) snakeHistory.pop();
                }

                // Sync Mesh Array with History Array
                while (snakeMeshes.length < snakeHistory.length) {
                    const m = snakeMeshes.length === 0 ? createHead() : createSegment();
                    snakeMeshes.push(m);
                    scene.add(m);
                }
                while (snakeMeshes.length > snakeHistory.length) {
                    scene.remove(snakeMeshes.pop());
                }
            }

            // 3. VISUAL UPDATE (Smoothly interpolation meshes)
            for (let i = 0; i < snakeHistory.length; i++) {
                const q = snakeHistory[i];
                const m = snakeMeshes[i];
                m.position.copy(START_POINT.clone().applyQuaternion(q));
                m.quaternion.slerp(q, 0.3); // Smooth rotation
            }
        }

        function endGame() {
            isGameOver = true;
            document.getElementById('game-over').style.display = 'block';
            document.getElementById('final-score').innerText = `FINAL SCORE: ${score}`;
        }

        function animate(time) {
            requestAnimationFrame(animate);
            update(time);

            if (!isGameOver && snakeMeshes.length > 0) {
                const headPos = snakeMeshes[0].position;

                // Camera: Follow head from distance
                const offset = headPos.clone().normalize().multiplyScalar(22);
                camera.position.lerp(offset, 0.05);
                camera.lookAt(headPos);

                // Dynamic Lighting
                light.position.copy(headPos.clone().multiplyScalar(2.5));
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        initGame();
        animate(0);
    </script>
</body>
</html>
