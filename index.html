<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Snake: Spherical Odyssey - V26 SMOOTH</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
        #ui { position: absolute; top: 20px; width: 100%; text-align: center; color: #00ffaa; pointer-events: none; text-shadow: 0 0 10px #00ffaa; }
        #game-over { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; text-align: center; display: none; background: rgba(0,0,0,0.9); padding: 40px; border: 2px solid #ff4444; border-radius: 15px; z-index: 10; }
        button { background: #00ffaa; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        #pause-ui { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 3em; display: none; pointer-events: none; }
    </style>
</head>
<body>
    <div id="ui"><h1 id="score">SCORE: 0</h1></div>
    <div id="pause-ui">PAUSED</div>
    <div id="game-over">
        <h1 style="color: #ff4444;">VOID CONSUMED YOU</h1>
        <p id="final-score"></p>
        <button onclick="location.reload()">RESTART</button>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- CONFIGURATION ---
        const RADIUS = 10;
        const STEP_DISTANCE = 0.45;
        const MOVE_INTERVAL = 150; 
        const SMOOTHING_SPEED = 0.15; // How fast segments follow the path (0-1)

        // --- STATE ---
        let score = 0;
        let isGameOver = false;
        let isPaused = false;
        let snakePositions = []; // Logical "grid" positions
        let snakeMeshes = [];    // Visual meshes
        let moveDir = new THREE.Vector3(0, 1, 0);
        let inputQueue = []; 
        let lastStepTime = 0;
        let food = { position: new THREE.Vector3(), mesh: null };
        let obstacles = [];

        // Smoothing Helpers
        let visualHeadPos = new THREE.Vector3(RADIUS, 0, 0);
        let visualSnakePositions = []; // Smoothed positions for rendering
        let cameraTargetUp = new THREE.Vector3(0, 1, 0);
        let currentCameraUp = new THREE.Vector3(0, 1, 0);

        // --- THREE.JS SETUP ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Starfield
        const starGeo = new THREE.BufferGeometry();
        const starCoords = [];
        for(let i=0; i<2000; i++) starCoords.push((Math.random()-0.5)*400, (Math.random()-0.5)*400, (Math.random()-0.5)*400);
        starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starCoords, 3));
        scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.7 })));

        scene.add(new THREE.AmbientLight(0x404040, 2));
        const light = new THREE.PointLight(0x00ffaa, 100, 50);
        scene.add(light);

        const planet = new THREE.Mesh(new THREE.SphereGeometry(RADIUS, 48, 48), new THREE.MeshPhongMaterial({ color: 0x111122, wireframe: true }));
        scene.add(planet);

        const foodGeo = new THREE.SphereGeometry(0.5, 16, 16);
        const foodMat = new THREE.MeshPhongMaterial({ color: 0xff00ff, emissive: 0xff00ff, emissiveIntensity: 0.5 });
        const foodMesh = new THREE.Mesh(foodGeo, foodMat);
        scene.add(foodMesh);
        food = { position: new THREE.Vector3(), mesh: foodMesh };

                                function createHead() {
            const group = new THREE.Group();

            // 1. THE CORE: Small, bright, and solid
            const coreMat = new THREE.MeshStandardMaterial({ 
                color: 0xffffff,       // White core looks "hotter" and more intense
                emissive: 0x00ffaa,    // Teal glow
                emissiveIntensity: 5,  // Very high intensity
                roughness: 0
            });
            const core = new THREE.Mesh(new THREE.SphereGeometry(0.25, 32, 32), coreMat);
            group.add(core);

            // 2. THE AURA: Large, soft, and translucent
            // This acts as the "particle/gas" look
            const auraMat = new THREE.MeshStandardMaterial({ 
                color: 0x00ffaa, 
                emissive: 0x00ffaa, 
                emissiveIntensity: 2,
                transparent: true,
                opacity: 0.3,          // Very faint
                depthWrite: false,     // Crucial: prevents the aura from "clipping" the core
                blending: THREE.AdditiveBlending // Makes it "glow" by adding color to the background
            });
            const aura = new THREE.Mesh(new THREE.SphereGeometry(0.5, 32, 32), auraMat);
            group.add(aura);

            // 3. THE RADIANCE: The light that hits the world
            const glowLight = new THREE.PointLight(0x00ffaa, 30, 6); 
            group.add(glowLight);

            return group;
        }

        function createSegment() {
            return new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), new THREE.MeshPhongMaterial({ color: 0x00cc88 }));
        }

        function spawnFood() {
            let validSpawn = false;
            let attempts = 0;
            const MAX_ATTEMPTS = 100;
            let newFoodPos = new THREE.Vector3();

            while (!validSpawn && attempts < MAX_ATTEMPTS) {
                attempts++;
                const phi = Math.acos(2 * Math.random() - 1); 
                const theta = Math.random() * Math.PI * 2;
                newFoodPos.set(
                    RADIUS * Math.sin(phi) * Math.cos(theta),
                    RADIUS * Math.sin(phi) * Math.sin(theta),
                    RADIUS * Math.cos(phi)
                );

                let collision = false;
                for (let obs of obstacles) if (newFoodPos.distanceTo(obs.position) < 1.5) collision = true;
                for (let pos of snakePositions) if (newFoodPos.distanceTo(pos) < 1.5) collision = true;
                if (!collision) validSpawn = true;
            }
            food.position.copy(newFoodPos);
            food.mesh.position.copy(newFoodPos);
        }

        function spawnObstacle() {
            const obs = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.7, 0.7), new THREE.MeshPhongMaterial({ color: 0x444444 }));
            let validSpawn = false;
            let attempts = 0;
            const startPos = snakePositions[0];

            while (!validSpawn && attempts < 50) {
                attempts++;
                const phi = Math.random() * Math.PI; 
                const theta = Math.random() * Math.PI * 2;
                const potentialPos = new THREE.Vector3(
                    RADIUS * Math.sin(phi) * Math.cos(theta),
                    RADIUS * Math.sin(phi) * Math.sin(theta),
                    RADIUS * Math.cos(phi)
                );
                if (potentialPos.distanceTo(startPos) > 4.0) {
                    validSpawn = true;
                    obs.position.copy(potentialPos);
                }
            }
            if (validSpawn) { scene.add(obs); obstacles.push(obs); }
        }

        function initGame() {
            snakeMeshes.forEach(m => scene.remove(m));
            snakeMeshes = [];
            obstacles.forEach(o => scene.remove(o));
            obstacles = [];

            snakePositions = [new THREE.Vector3(RADIUS, 0, 0)];
            visualSnakePositions = [new THREE.Vector3(RADIUS, 0, 0)];
            const head = createHead();
            snakeMeshes = [head];
            scene.add(head);

            score = 0; 
            isGameOver = false;
            moveDir.set(0, 1, 0);
            inputQueue = []; 
            lastStepTime = performance.now();

            document.getElementById('score').innerText = "SCORE: 0";
            document.getElementById('game-over').style.display = 'none';

            for(let i=0; i<30; i++) spawnObstacle();
            spawnFood();
        }

                window.addEventListener('keydown', (e) => {
            // 1. Handle Pausing
            if (e.code === 'Space') {
                isPaused = !isPaused;
                return;
            }

            if (isGameOver || isPaused) return;

            const currentPos = snakePositions[0].clone().normalize(); 
            const rightVec = new THREE.Vector3().crossVectors(currentPos, moveDir).normalize();
            const upRelativeVec = new THREE.Vector3().crossVectors(rightVec, currentPos).normalize();

            let newDir = moveDir.clone();

            // Determine intended direction based on input
            if (e.key === 'a' || e.key === 'ArrowLeft') newDir.copy(rightVec);
            else if (e.key === 'd' || e.key === 'ArrowRight') newDir.copy(rightVec.clone().negate());
            else if (e.key === 'w' || e.key === 'ArrowUp') newDir.copy(upRelativeVec);
            else if (e.key === 's' || e.key === 'ArrowDown') newDir.copy(upRelativeVec.clone().negate());
            else return; // Exit if key isn't a movement key

            // --- THE FIX: STRICT DIRECTIONAL VALIDATION ---

            // A: Check against the direction we are currently moving
            if (newDir.dot(moveDir) < -0.5) return;

            // B: Check against the direction we are ABOUT to move (the last item in queue)
            // This prevents the "double tap" from adding two opposite turns in a row.
            if (inputQueue.length > 0) {
                const lastQueuedDir = inputQueue[inputQueue.length - 1];
                if (newDir.dot(lastQueuedDir) < -0.5) {
                    // If this turn is a reversal of the turn we just queued, 
                    // ignore it entirely to prevent the 180-degree "crash".
                    return; 
                }
            }

            newDir.projectOnPlane(currentPos);
            newDir.normalize();

            // Final check: is this direction actually different from what we're doing?
            // This prevents flooding the queue with the same direction.
            if (newDir.dot(moveDir) > 0.99 && inputQueue.length === 0) return;

            inputQueue.push(newDir.clone());

            // Keep queue small to ensure responsiveness and prevent "stale" turns
            if(inputQueue.length > 2) inputQueue.shift();
        });

        function performMovementStep() {
            if (inputQueue.length > 0) moveDir.copy(inputQueue.shift());

            const currentPos = snakePositions[0].clone();
            const tangentDir = moveDir.clone().normalize();
            const newPos = currentPos.clone()
                .add(tangentDir.multiplyScalar(STEP_DISTANCE))
                .normalize()
                .multiplyScalar(RADIUS);

            moveDir.copy(newPos.clone().sub(currentPos).normalize());

                                    // --- IMPROVED COLLISION LOGIC ---
            let collisionDetected = false;

            // 1. SELF COLLISION (Very tight radius to allow sharp turns)
            // We use a small radius so the head can "swing" around the neck.
            const selfCollisionRadius = 0.35; 
            // Skip the first 6 segments to allow for the "swing" of the turn
            for (let i = 6; i < snakePositions.length; i++) {
                if (newPos.distanceTo(snakePositions[i]) < selfCollisionRadius) {
                    collisionDetected = true;
                    break;
                }
            }

            // 2. OBSTACLE & FOOD COLLISION (Standard radius)
            // We keep this larger so the player actually feels the danger of obstacles.
            if (!collisionDetected) {
                for (let i = 0; i < obstacles.length; i++) {
                    if (newPos.distanceTo(obstacles[i].position) < 0.8) {
                        collisionDetected = true;
                        break;
                    }
                }
            }

            // 3. FINAL CHECK
            if (collisionDetected) {
                endGame();
                return;
            }

            // 4. EATING LOGIC (Standard radius)
            const eating = newPos.distanceTo(food.position) < 1.0;
            if (eating) {
                score += 10;
                document.getElementById('score').innerText = `SCORE: ${score}`;
                spawnFood();
            } else {
                snakePositions.pop();
            }

            snakePositions.unshift(newPos.clone());

            // Ensure visual array matches logical array length
            while (visualSnakePositions.length < snakePositions.length) {
                visualSnakePositions.push(snakePositions[visualSnakePositions.length-1].clone());
            }
            if (visualSnakePositions.length > snakePositions.length) visualSnakePositions.pop();

            // Sync Meshes
            while (snakeMeshes.length < snakePositions.length) {
                const m = snakeMeshes.length === 0 ? createHead() : createSegment();
                snakeMeshes.push(m);
                scene.add(m);
            }
            while (snakeMeshes.length > snakePositions.length) {
                scene.remove(snakeMeshes.pop());
            }
        }

        function endGame() {
            isGameOver = true;
            document.getElementById('game-over').style.display = 'block';
            document.getElementById('final-score').innerText = `FINAL SCORE: ${score}`;
        }

        function animate(currentTime) {
            requestAnimationFrame(animate);

            if (!isGameOver) {
                if (!isPaused) {
                    document.getElementById('pause-ui').style.display = 'none';
                    if (currentTime - lastStepTime >= MOVE_INTERVAL) {
                        performMovementStep();
                        lastStepTime = currentTime;
                    }

                    // 1. SMOOTH THE SNAKE PATH
                    // We lerp the visual positions toward the logical grid positions
                    for (let i = 0; i < snakePositions.length; i++) {
                        visualSnakePositions[i].lerp(snakePositions[i], SMOOTHING_SPEED);
                    }

                    // 2. UPDATE MESHES (Visual)
                    if (snakeMeshes.length > 0) {
                        for (let i = 0; i < snakeMeshes.length; i++) {
                            const mesh = snakeMeshes[i];
                            const pos = visualSnakePositions[i];
                            mesh.position.copy(pos);

                            // Orientation: Look at the next visual segment
                            if (i < snakeMeshes.length - 1) {
                                mesh.lookAt(visualSnakePositions[i+1]);
                            } else {
                                const lookTarget = pos.clone().add(moveDir);
                                mesh.lookAt(lookTarget);
                            }
                            // Keep the head upright relative to the sphere surface
                            mesh.up.copy(pos.clone().normalize());
                        }

                        // 3. SMOOTH CAMERA
                        visualHeadPos.lerp(snakeMeshes[0].position, 0.1);
                        camera.position.lerp(visualHeadPos.clone().normalize().multiplyScalar(18), 0.05);

                        // Stable Camera Up: Calculate where Up should be, then lerp it
                        const headNormal = visualHeadPos.clone().normalize();
                        const desiredUp = moveDir.clone().projectOnPlane(headNormal).normalize();
                        // If the desiredUp is too close to headNormal, fallback to a stable axis
                        if (Math.abs(desiredUp.dot(headNormal)) > 0.95) {
                            cameraTargetUp.set(0, 1, 0).projectOnPlane(headNormal).normalize();
                        } else {
                            cameraTargetUp.copy(desiredUp);
                        }

                        currentCameraUp.lerp(cameraTargetUp, 0.05);
                        camera.up.copy(currentCameraUp);
                        camera.lookAt(visualHeadPos);

                        light.position.copy(visualHeadPos.clone().multiplyScalar(2));
                    }
                } else {
                    document.getElementById('pause-ui').style.display = 'block';
                }
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        initGame();
        requestAnimationFrame(animate);
    </script>
</body>
</html>
