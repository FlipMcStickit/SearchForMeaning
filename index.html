<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Snake: Spherical Odyssey - V26 SMOOTH</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
        #ui { position: absolute; top: 20px; width: 100%; text-align: center; color: #00ffaa; pointer-events: none; text-shadow: 0 0 10px #00ffaa; }
        #game-over { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; text-align: center; display: none; background: rgba(0,0,0,0.9); padding: 40px; border: 2px solid #ff4444; border-radius: 15px; z-index: 10; }
        button { background: #00ffaa; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        #pause-ui { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 3em; display: none; pointer-events: none; }
    </style>
</head>
<body>
    <div id="ui"><h1 id="score">SCORE: 0</h1></div>
    <div id="pause-ui">PAUSED</div>
    <div id="game-over">
        <h1 style="color: #ff4444;">VOID CONSUMED YOU</h1>
        <p id="final-score"></p>
        <button onclick="location.reload()">RESTART</button>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- CONFIGURATION ---
        const RADIUS = 10;
        const STEP_DISTANCE = 0.45;
        const BASE_MOVE_INTERVAL = 150; 
        const BOOST_MOVE_INTERVAL = 60;  
        const SMOOTHING_SPEED = 0.15; 

        // --- STATE ---
        let score = 0;
        let currentMoveInterval = BASE_MOVE_INTERVAL;
        let isWPressed = false;
        let isGameOver = false;
        let isPaused = false;
        let snakePositions = []; 
        let snakeMeshes = [];    
        let moveDir = new THREE.Vector3(0, 1, 0);
        let inputQueue = []; 
        let lastStepTime = 0;
        let food = { position: new THREE.Vector3(), mesh: null };
        let obstacles = [];

        // Smoothing Helpers
        let visualHeadPos = new THREE.Vector3(RADIUS, 0, 0);
        let visualSnakePositions = []; 
        let cameraTargetUp = new THREE.Vector3(0, 1, 0);
        let currentCameraUp = new THREE.Vector3(0, 1, 0);

        // --- THREE.JS SETUP ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // --- THE PLANET (A faint, gaseous sphere) ---

        // 1. Create a soft, cloudy texture using a Canvas
        const canvas = document.createElement('canvas');
        canvas.width = 512; canvas.height = 512;
        const ctx = canvas.getContext('2d');

        // Create a dark background
        ctx.fillStyle = '#050510';
        ctx.fillRect(0, 0, 512, 512);

        // Draw some random "cloud" blobs
        for(let i = 0; i < 20; i++) {
            const x = Math.random() * 512;
            const y = Math.random() * 512;
            const radius = Math.random() * 150 + 50;
            const gradient = ctx.createRadialGradient(x, y, 0, x, y, radius);
            // Using a very dark teal/blue for the clouds
            gradient.addColorStop(0, 'rgba(0, 50, 50, 0.2)'); 
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.fill();
        }
        const cloudTexture = new THREE.CanvasTexture(canvas);

        // 2. Create the Planet Mesh
        const planetMaterial = new THREE.MeshPhongMaterial({ 
            map: cloudTexture,
            transparent: true, 
            opacity: 0.4,        // This ensures you can see through it!
            side: THREE.DoubleSide // Allows you to see the "inside" of the sphere
        });

        const planet = new THREE.Mesh(new THREE.SphereGeometry(RADIUS, 64, 64), planetMaterial);
        scene.add(planet);

        // 3. Add a very faint starfield in the background
        const starGeo = new THREE.BufferGeometry();
        const starCoords = [];
        for(let i=0; i<1000; i++) starCoords.push((Math.random()-0.5)*400, (Math.random()-0.5)*400, (Math.random()-0.5)*400);
        starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starCoords, 3));
        scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.5 })));

        // 4. LIGHTING (Crucial: Don't delete these!)
        scene.add(new THREE.AmbientLight(0x404040, 2));
        const light = new THREE.PointLight(0x00ffaa, 100, 50);
        scene.add(light);

        // --- FOOD SETUP ---
        const foodGroup = new THREE.Group();
        const canvasF = document.createElement('canvas');
        canvasF.width = 64; canvasF.height = 64;
        const ctxF = canvasF.getContext('2d');
        const gradF = ctxF.createRadialGradient(32, 32, 0, 32, 32, 32);
        gradF.addColorStop(0, 'rgba(255, 50, 255, 1)');
        gradF.addColorStop(0.5, 'rgba(150, 0, 255, 0.3)');
        gradF.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctxF.fillStyle = gradF;
        ctxF.fillRect(0, 0, 64, 64);
        const particleTexture = new THREE.CanvasTexture(canvasF);

        const particleCount = 25; 
        const particles = [];
        for (let i = 0; i < particleCount; i++) {
            const spriteMat = new THREE.SpriteMaterial({ map: particleTexture, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false });
            const sprite = new THREE.Sprite(spriteMat);
            sprite.userData = { speed: 0.2 + Math.random() * 0.3, drift: (Math.random() - 0.5) * 0.1, life: Math.random() };
            foodGroup.add(sprite);
            particles.push(sprite);
        }
        scene.add(foodGroup);
        food = { position: new THREE.Vector3(), mesh: foodGroup, particles: particles };

        function createHead() {
            const group = new THREE.Group();
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const context = canvas.getContext('2d');
            function drawBlob(x, y, radius, color) {
                const grad = context.createRadialGradient(x, y, 0, x, y, radius);
                grad.addColorStop(0, color);
                grad.addColorStop(1, 'rgba(0,0,0,0)');
                context.fillStyle = grad;
                context.beginPath();
                context.arc(x, y, radius, 0, Math.PI * 2);
                context.fill();
            }
            context.fillStyle = 'rgba(0, 0, 0, 0)'; 
            context.fillRect(0, 0, 256, 256);
            for(let i=0; i<70; i++) drawBlob(Math.random()*256, Math.random()*256, 10+Math.random()*45, 'rgba(255, 60, 0, 0.5)'); 
            for(let i=0; i<40; i++) drawBlob(Math.random()*256, Math.random()*256, 5+Math.random()*25, 'rgba(255, 255, 180, 0.4)'); 
            const glowTexture = new THREE.CanvasTexture(canvas);
            const scale = 0.4; 
            const coreMat = new THREE.MeshBasicMaterial({ map: glowTexture, transparent: true, blending: THREE.AdditiveBlending, side: THREE.DoubleSide });
            const auraMat = new THREE.MeshBasicMaterial({ map: glowTexture, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, opacity: 0.6 });
            const core = new THREE.Mesh(new THREE.SphereGeometry(0.2 * scale, 32, 32), coreMat);
            core.scale.set(1.1, 0.7, 1.1); group.add(core);
            const aura1 = new THREE.Mesh(new THREE.SphereGeometry(0.4 * scale, 32, 32), auraMat);
            aura1.scale.set(1.3, 1.0, 1.3); group.add(aura1);
            const aura2 = new THREE.Mesh(new THREE.SphereGeometry(0.6 * scale, 32, 32), auraMat);
            aura2.rotation.set(Math.PI / 3, Math.PI / 4, 0); aura2.scale.set(1.1, 1.3, 1.1); group.add(aura2);
            const aura3 = new THREE.Mesh(new THREE.SphereGeometry(0.8 * scale, 32, 32), auraMat);
            aura3.rotation.set(0, Math.PI / 2, Math.PI / 3); group.add(aura3);
            const glowLight = new THREE.PointLight(0xffaa00, 80, 8); group.add(glowLight);
            group.userData.isPlasma = true;
            return group;
        }

        function createSegment() {
            const segmentGroup = new THREE.Group();
            const pCount = 12; 
            for (let i = 0; i < pCount; i++) {
                const canvas = document.createElement('canvas');
                canvas.width = 32; canvas.height = 32;
                const ctx = canvas.getContext('2d');
                const grad = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
                const colors = ['rgba(0, 255, 255, 0.5)', 'rgba(255, 0, 255, 0.5)', 'rgba(255, 100, 0, 0.5)'];
                const chosenColor = colors[Math.floor(Math.random() * colors.length)];
                grad.addColorStop(0, chosenColor);
                grad.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, 32, 32);
                const texture = new THREE.CanvasTexture(canvas);
                const mat = new THREE.SpriteMaterial({ map: texture, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false });
                const sprite = new THREE.Sprite(mat);

                // --- THE FIX IS HERE ---
                // We add 'segmentIndex' to userData so the animate loop knows which part of the tail it belongs to
                sprite.userData = { 
                    offset: Math.random() * Math.PI * 2, 
                    speed: 0.5 + Math.random() * 1.5 
                };

                sprite.position.set((Math.random()-0.5)*0.4, (Math.random()-0.5)*0.4, (Math.random()-0.5)*0.4);
                const s = 0.3 + Math.random() * 0.5;
                sprite.scale.set(s, s, s);
                segmentGroup.add(sprite);
            }
            const coreMat = new THREE.MeshBasicMaterial({ color: 0x00ffaa, transparent: true, opacity: 0.2, blending: THREE.AdditiveBlending });
            segmentGroup.add(new THREE.Mesh(new THREE.SphereGeometry(0.1, 8, 8), coreMat));
            return segmentGroup;
        }

        function spawnFood() {
            let validSpawn = false, attempts = 0;
            let newFoodPos = new THREE.Vector3();
            while (!validSpawn && attempts < 100) {
                attempts++;
                const phi = Math.acos(2 * Math.random() - 1), theta = Math.random() * Math.PI * 2;
                newFoodPos.set(RADIUS * Math.sin(phi) * Math.cos(theta), RADIUS * Math.sin(phi) * Math.sin(theta), RADIUS * Math.cos(phi));
                let collision = false;
                for (let obs of obstacles) if (newFoodPos.distanceTo(obs.position) < 1.5) collision = true;
                for (let pos of snakePositions) if (newFoodPos.distanceTo(pos) < 1.5) collision = true;
                if (!collision) validSpawn = true;
            }
            food.position.copy(newFoodPos);
            food.mesh.position.copy(newFoodPos);
        }

        function spawnObstacle() {
            // 1. Create a complex shape (Icosahedron)
            const geometry = new THREE.IcosahedronGeometry(0.6, 0); // Low detail = sharper edges

            // 2. Randomize the shape by moving its vertices
            const positionAttribute = geometry.getAttribute('position');
            const vertex = new THREE.Vector3();
            for (let i = 0; i < positionAttribute.count; i++) {
                vertex.fromBufferAttribute(positionAttribute, i);
                // Move each corner by a random amount to make it look "crystalized"
                const factor = 0.3 + Math.random() * 0.4; 
                vertex.multiplyScalar(factor);
                positionAttribute.setXYZ(i, vertex.x, vertex.y, vertex.z);
            }
            geometry.computeVertexNormals(); // Recalculate lighting for the new shape

            // 3. Create a random shade of green
            const greenShades = [0x00ff88, 0x22aa44, 0x00cc66, 0xadffaf, 0x004422];
            const randomColor = greenShades[Math.floor(Math.random() * greenShades.length)];

            // 4. Use MeshPhongMaterial so it reacts to the light (shiny/crystalline look)
            const material = new THREE.MeshPhongMaterial({ 
                color: randomColor, 
                flatShading: true, // This is key! It gives it that faceted crystal look
                shininess: 100 
            });

            const obs = new THREE.Mesh(geometry, material);

            let validSpawn = false, attempts = 0, startPos = snakePositions[0];
            while (!validSpawn && attempts < 50) {
                attempts++;
                const phi = Math.random() * Math.PI, theta = Math.random() * Math.PI * 2;
                const pot = new THREE.Vector3(RADIUS * Math.sin(phi) * Math.cos(theta), RADIUS * Math.sin(phi) * Math.sin(theta), RADIUS * Math.cos(phi));
                if (pot.distanceTo(startPos) > 4.0) { validSpawn = true; obs.position.copy(pot); }
            }
            if (validSpawn) { scene.add(obs); obstacles.push(obs); }
        }

        function initGame() {
            snakeMeshes.forEach(m => scene.remove(m)); snakeMeshes = [];
            obstacles.forEach(o => scene.remove(o)); obstacles = [];
            snakePositions = [new THREE.Vector3(RADIUS, 0, 0)];
            visualSnakePositions = [new THREE.Vector3(RADIUS, 0, 0)];
            const head = createHead(); snakeMeshes = [head]; scene.add(head);
            score = 0; isGameOver = false; moveDir.set(0, 1, 0); inputQueue = []; lastStepTime = performance.now();
            document.getElementById('score').innerText = "SCORE: 0";
            document.getElementById('game-over').style.display = 'none';
            for(let i=0; i<30; i++) spawnObstacle();
            spawnFood();
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW') { isWPressed = true; currentMoveInterval = BOOST_MOVE_INTERVAL; }
            if (e.code === 'Space') { isPaused = !isPaused; return; }
            if (isGameOver || isPaused) return;
            const currentPos = snakePositions[0].clone().normalize(); 
            const rightVec = new THREE.Vector3().crossVectors(currentPos, moveDir).normalize();
            const upRel = new THREE.Vector3().crossVectors(rightVec, currentPos).normalize();
            let newDir = moveDir.clone();
            if (e.key === 'a' || e.key === 'ArrowLeft') newDir.copy(rightVec);
            else if (e.key === 'd' || e.key === 'ArrowRight') newDir.copy(rightVec.clone().negate());
            else if (e.key === 'w' || e.key === 'ArrowUp') newDir.copy(upRel);
            else if (e.key === 's' || e.key === 'ArrowDown') newDir.copy(upRel.clone().negate());
            else return; 
            if (newDir.dot(moveDir) < -0.5) return;
            if (inputQueue.length > 0 && newDir.dot(inputQueue[inputQueue.length-1]) < -0.5) return;
            newDir.projectOnPlane(currentPos); newDir.normalize();
            if (newDir.dot(moveDir) > 0.99 && inputQueue.length === 0) return;
            inputQueue.push(newDir.clone());
            if(inputQueue.length > 2) inputQueue.shift();
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW') { isWPressed = false; currentMoveInterval = BASE_MOVE_INTERVAL; }
        });

        function performMovementStep() {
            if (inputQueue.length > 0) moveDir.copy(inputQueue.shift());
            const currentPos = snakePositions[0].clone();
            const tangentDir = moveDir.clone().normalize();
            const newPos = currentPos.clone().add(tangentDir.multiplyScalar(STEP_DISTANCE)).normalize().multiplyScalar(RADIUS);
            moveDir.copy(newPos.clone().sub(currentPos).normalize());

            let collision = false;
            for (let i = 6; i < snakePositions.length; i++) if (newPos.distanceTo(snakePositions[i]) < 0.3) collision = true;
            if (!collision) for (let obs of obstacles) if (newPos.distanceTo(obs.position) < 0.4) collision = true;
            if (collision) { endGame(); return; }

            if (newPos.distanceTo(food.position) < 0.6) {
                score += 10; document.getElementById('score').innerText = `SCORE: ${score}`;
                spawnFood();
            } else { snakePositions.pop(); }
            snakePositions.unshift(newPos.clone());

            while (snakeMeshes.length < snakePositions.length) {
                const m = snakeMeshes.length === 0 ? createHead() : createSegment();
                snakeMeshes.push(m); scene.add(m);
            }
            while (snakeMeshes.length > snakePositions.length) scene.remove(snakeMeshes.pop());

            if (visualSnakePositions.length < snakePositions.length) {
                for (let i = visualSnakePositions.length; i < snakePositions.length; i++) visualSnakePositions.push(snakePositions[i].clone());
            } else if (visualSnakePositions.length > snakePositions.length) {
                visualSnakePositions.pop();
            }
        }

        function endGame() {
            isGameOver = true; document.getElementById('game-over').style.display = 'block';
            document.getElementById('final-score').innerText = `FINAL SCORE: ${score}`;
        }

        function animate(currentTime) {
            requestAnimationFrame(animate);
            if (!isGameOver) {
                if (!isPaused) {
                    document.getElementById('pause-ui').style.display = 'none';
                    if (currentTime - lastStepTime >= currentMoveInterval) { performMovementStep(); lastStepTime = currentTime; }

                    // DRAG LOGIC
                    visualSnakePositions[0].lerp(snakePositions[0], 0.3);
                    for (let i = 1; i < visualSnakePositions.length; i++) {
                        const dragFactor = 0.15 / (1 + (i * 0.05)); 
                        const targetPos = visualSnakePositions[i - 1].clone();
                        visualSnakePositions[i].lerp(targetPos, dragFactor);
                    }
                    if (visualSnakePositions.length > 1) visualSnakePositions[visualSnakePositions.length-1].lerp(snakePositions[snakePositions.length-1], 0.1);

                    // UPDATE MESHES
                    if (snakeMeshes.length > 0) {
                        for (let i = 0; i < snakeMeshes.length; i++) {
                            const mesh = snakeMeshes[i];
                            const pos = visualSnakePositions[i];
                            mesh.position.copy(pos);
                            if (i < snakeMeshes.length - 1) mesh.lookAt(visualSnakePositions[i+1]);
                            else mesh.lookAt(pos.clone().add(moveDir));
                            mesh.up.copy(pos.clone().normalize());

                            if (i > 0) {
                                const time = currentTime * 0.005;
                                const turbulence = isWPressed ? 0.05 : 0.02;

                                // 1. Calculate how 'tight' the gas should be. 
                                // Segment 1 (i=1) is wide (~0.37). 
                                // As i increases, this value shrinks, pulling particles to the center.
                                const taper = Math.max(0.1, 0.4 - (i * 0.04)); 

                                mesh.children.forEach((child, idx) => {
                                    if (child.isSprite) {
                                        // 2. We use a sine wave to create an 'orbit' 
                                        // and multiply it by 'taper' so they stay close to the core.
                                        const orbitRadius = taper; 
                                        const angle = time + idx; // unique angle per particle

                                        // This sets the base position (the orbit)
                                        const targetX = Math.cos(angle) * orbitRadius;
                                        const targetY = Math.sin(angle) * orbitRadius;

                                        // 3. We add the turbulence on top of that orbit
                                        child.position.x = targetX + Math.sin(time * 2 + i + idx) * turbulence;
                                        child.position.y = targetY + Math.cos(time * 1.5 + i + idx) * turbulence;

                                        const pulse = 0.4 + Math.sin(time + i) * 0.15;
                                        child.scale.set(pulse, pulse, pulse);
                                    }
                                });
                            }
                        }
                        visualHeadPos.lerp(snakeMeshes[0].position, 0.1);
                        camera.position.lerp(visualHeadPos.clone().normalize().multiplyScalar(18), 0.05);
                        const headNormal = visualHeadPos.clone().normalize();
                        const desiredUp = moveDir.clone().projectOnPlane(headNormal).normalize();
                        if (Math.abs(desiredUp.dot(headNormal)) > 0.95) cameraTargetUp.set(0, 1, 0).projectOnPlane(headNormal).normalize();
                        else cameraTargetUp.copy(desiredUp);
                        currentCameraUp.lerp(cameraTargetUp, 0.05);
                        camera.up.copy(currentCameraUp);
                        camera.lookAt(visualHeadPos);
                        light.position.copy(visualHeadPos.clone().multiplyScalar(2));
                    }
                } else { document.getElementById('pause-ui').style.display = 'block'; }
            }

            if (food.mesh) {
                const time = performance.now() * 0.005;
                const upDir = food.position.clone().normalize();
                food.mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), upDir);
                food.particles.forEach((p, i) => {
                    const lifeProgress = (time * p.userData.speed + p.userData.life) % 1;
                    const height = lifeProgress * 0.8, width = (1.0 - lifeProgress) * 0.4; 
                    p.position.set(p.userData.drift * Math.sin(time + i) * width, height, p.userData.drift * Math.cos(time + i) * width);
                    const scale = (1.0 - lifeProgress) * 0.5;
                    p.scale.set(scale, scale, scale);
                    p.material.opacity = (1.0 - lifeProgress);
                });
            }
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        initGame();
        requestAnimationFrame(animate);
    </script>
</body>
</html>
