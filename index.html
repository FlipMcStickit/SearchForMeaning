<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kevin's Existential Crisis: The Web Void</title>
    <style>
        body { margin: 0; background-color: #05050a; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; color: white; font-family: 'Georgia', serif; }
        canvas { border: 2px solid #222; background-color: #000; box-shadow: 0 0 50px rgba(0, 0, 0, 1); }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="600" height="400"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const SPHERE_RADIUS = 200;
        const STEP_SIZE = 0.15;
        let sparkSize = 12;

        let snake = [{ x: 0, y: 0, z: SPHERE_RADIUS }]; 
        let direction = { dx: 0, dy: 0, dz: 0 }; 
        let inputQueue = [];
        let food = { x: 50, y: 50, z: 150 };
        let obstacles = [];
        let isGameOver = false;
        let lastUpdateTime = 0;
        let moveInterval = 120;

        let cameraRotation = { yaw: 0, pitch: 0 };

        const vec = {
            normalize: (v) => {
                const mag = Math.sqrt(v.x*v.x + v.y*v.y + v.z*v.z);
                return { x: (v.x/mag)*SPHERE_RADIUS, y: (v.y/mag)*SPHERE_RADIUS, z: (v.z/mag)*SPHERE_RADIUS };
            },
            rotate: (p, yaw, pitch) => {
                // Yaw (around Y)
                let x = p.x * Math.cos(yaw) - p.z * Math.sin(yaw);
                let z = p.x * Math.sin(yaw) + p.z * Math.cos(yaw);
                let y = p.y;
                // Pitch (around X)
                let finalY = y * Math.cos(pitch) - z * Math.sin(pitch);
                let finalZ = y * Math.sin(pitch) + z * Math.cos(pitch);
                return { x: x, y: finalY, z: finalZ };
            }
        };

        function resetGame() {
            snake = [{ x: 0, y: 0, z: SPHERE_RADIUS }];
            inputQueue = [];
            isGameOver = false;
            cameraRotation = { yaw: 0, pitch: 0 };
            generateObstacles();
            spawnFood();
        }

        function spawnFood() {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);
            food = {
                x: SPHERE_RADIUS * Math.sin(phi) * Math.cos(theta),
                y: SPHERE_RADIUS * Math.sin(phi) * Math.sin(theta),
                z: SPHERE_RADIUS * Math.cos(phi)
            };
        }

        function generateObstacles() {
            obstacles = [];
            for(let i=0; i<20; i++) {
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos((Math.random() * 2) - 1);
                obstacles.push({
                    x: SPHERE_RADIUS * Math.sin(phi) * Math.cos(theta),
                    y: SPHERE_RADIUS * Math.sin(phi) * Math.sin(theta),
                    z: SPHERE_RADIUS * Math.cos(phi)
                });
            }
        }

        window.addEventListener('keydown', (e) => {
            if (isGameOver && (e.key === ' ' || e.key === 'Enter')) { resetGame(); return; }
            let move = null;
            if (e.key === 'ArrowUp' || e.key === 'w')    move = { yaw: 0, pitch: STEP_SIZE };
            if (e.key === 'ArrowDown' || e.key === 's')  move = { yaw: 0, pitch: -STEP_SIZE };
            if (e.key === 'ArrowLeft' || e.key === 'a')  move = { yaw: -STEP_SIZE, pitch: 0 };
            if (e.key === 'ArrowRight' || e.key === 'd') move = { yaw: STEP_SIZE, pitch: 0 };
            if (move) inputQueue.push(move);
        });

        function update() {
            let currentTime = Date.now();
            if (currentTime - lastUpdateTime < moveInterval) return;
            lastUpdateTime = currentTime;

            if (inputQueue.length > 0) {
                const move = inputQueue.shift();
                const head = snake[0];

                let nextX = head.x * Math.cos(move.yaw) - head.z * Math.sin(move.yaw);
                let nextZ = head.x * Math.sin(move.yaw) + head.z * Math.cos(move.yaw);
                let nextY = head.y * Math.cos(move.pitch) - nextZ * Math.sin(move.pitch);
                nextZ = head.y * Math.sin(move.pitch) + nextZ * Math.cos(move.pitch);

                const newHead = vec.normalize({ x: nextX, y: nextY, z: nextZ });

                const hitObstacle = obstacles.some(o => Math.hypot(o.x-newHead.x, o.y-newHead.y, o.z-newHead.z) < 20);
                const hitSelf = snake.some(s => Math.hypot(s.x-newHead.x, s.y-newHead.y, s.z-newHead.z) < 15);

                if (hitObstacle || hitSelf) {
                    isGameOver = true;
                } else {
                    snake.unshift(newHead);
                    if (Math.hypot(newHead.x-food.x, newHead.y-food.y, newHead.z-food.z) < 25) {
                        spawnFood();
                    } else {
                        snake.pop();
                    }
                }
            }

            const head = snake[0];
            const targetYaw = Math.atan2(head.x, head.z);
            const targetPitch = Math.asin(head.y / SPHERE_RADIUS);
            cameraRotation.yaw += (targetYaw - cameraRotation.yaw) * 0.1;
            cameraRotation.pitch += (targetPitch - cameraRotation.pitch) * 0.1;
        }

        function draw() {
            update();
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const project = (p) => {
                const rotated = vec.rotate(p, -cameraRotation.yaw, -cameraRotation.pitch);
                // Perspective scale: closer objects are larger
                // We offset Z so the sphere center is at 0, and camera "looks" through it
                const scale = (rotated.z + 400) / 400; 
                const isVisible = rotated.z > -150; // Hide objects "behind" the sphere curve
                return {
                    x: rotated.x * scale + canvas.width / 2,
                    y: rotated.y * scale + canvas.height / 2,
                    scale: scale,
                    visible: isVisible
                };
            };

            if (isGameOver) {
                ctx.fillStyle = "white";
                ctx.textAlign = "center";
                ctx.font = "30px Georgia";
                ctx.fillText("THE VOID CONSUMES ALL", canvas.width / 2, canvas.height / 2);
                ctx.font = "16px Georgia";
                ctx.fillText("Press Space to seek meaning again", canvas.width / 2, canvas.height / 2 + 40);
            } else {

                // --- DRAW SPHERE GRID ---
                ctx.strokeStyle = "#1a1a3a"; // Very dark blue/grey
                ctx.lineWidth = 1;

                // Longitudinal lines (Vertical-ish)
                for (let i = 0; i < 12; i++) {
                    const angle = (i / 12) * Math.PI * 2;
                    const linePoints = [];
                    for (let step = -Math.PI/2; step <= Math.PI/2; step += 0.1) {
                        const p = {
                            x: SPHERE_RADIUS * Math.cos(step) * Math.cos(angle),
                            y: SPHERE_RADIUS * Math.sin(step),
                            z: SPHERE_RADIUS * Math.cos(step) * Math.sin(angle)
                        };
                        linePoints.push(project(p));
                    }
                    // Draw line segment
                    ctx.beginPath();
                    for (let j = 1; j < linePoints.length; j++) {
                        if (linePoints[j].visible && linePoints[j-1].visible) {
                            ctx.moveTo(linePoints[j-1].x, linePoints[j-1].y);
                            ctx.lineTo(linePoints[j].x, linePoints[j].y);
                        }
                    }
                    ctx.stroke();
                }

                // Latitudinal lines (Horizontal-ish)
                for (let i = 1; i < 6; i++) {
                    const lat = -Math.PI/2 + (i/6) * Math.PI;
                    const linePoints = [];
                    for (let step = 0; step <= Math.PI * 2; step += 0.2) {
                        const p = {
                            x: SPHERE_RADIUS * Math.cos(lat) * Math.cos(step),
                            y: SPHERE_RADIUS * Math.sin(lat),
                            z: SPHERE_RADIUS * Math.cos(lat) * Math.sin(step)
                        };
                        linePoints.push(project(p));
                    }
                    ctx.beginPath();
                    for (let j = 1; j < linePoints.length; j++) {
                        if (linePoints[j].visible && linePoints[j-1].visible) {
                            ctx.moveTo(linePoints[j-1].x, linePoints[j-1].y);
                            ctx.lineTo(linePoints[j].x, linePoints[j].y);
                        }
                    }
                    ctx.stroke();
                }

                // --- DRAW GAME OBJECTS ---

                // Obstacles
                ctx.fillStyle = "#444";
                obstacles.forEach(o => {
                    const p = project(o);
                    if (p.visible) {
                        ctx.globalAlpha = Math.max(0, p.scale * 0.5);
                        ctx.fillRect(p.x, p.y, sparkSize, sparkSize);
                    }
                });

                // Food
                const fp = project(food);
                if (fp.visible) {
                    ctx.fillStyle = "red";
                    ctx.globalAlpha = Math.max(0, fp.scale);
                    ctx.beginPath();
                    ctx.arc(fp.x, fp.y, sparkSize * fp.scale, 0, Math.PI*2);
                    ctx.fill();
                }

                // Snake
                snake.forEach((s, i) => {
                    const p = project(s);
                    if (p.visible) {
                        ctx.fillStyle = i === 0 ? "#00ffaa" : "#008866";
                        ctx.globalAlpha = Math.max(0, p.scale);
                        ctx.fillRect(p.x, p.y, sparkSize, sparkSize);
                    }
                });
                ctx.globalAlpha = 1.0;
            }

            requestAnimationFrame(draw);
        }

        resetGame();
        draw();
    </script>
</body>
</html>
